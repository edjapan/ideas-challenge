<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>FREX Challenge - Lead Management System</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* LMS Premium Styles */
    :root {
      --maroon: #8b2f3a;
      --maroon-light: #b5495a;
      --cream: #fdf3ee;
      --panel-border: rgba(255, 255, 255, 0.14);
      --accent: #ffb37a;
      --bg: #0a060c;
      --panel: rgba(255, 255, 255, 0.05);
      --text: rgba(253, 243, 238, 0.9);
      --text-muted: rgba(253, 243, 238, 0.5);
    }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* LOGIN VIEW */
    #login-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
    }
    .login-box {
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      backdrop-filter: blur(12px);
      padding: 40px;
      border-radius: 16px;
      border: 1px solid var(--panel-border);
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .login-box h2 { 
      margin: 0 0 24px; 
      font-weight: 700; 
      font-size: 24px;
      letter-spacing: -0.5px;
      color: var(--cream);
    }
    .input-field {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      background: rgba(0,0,0,0.25);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-family: 'Inter';
      box-sizing: border-box;
      transition: border-color 0.2s ease;
    }
    .input-field:focus {
      outline: none;
      border-color: var(--accent);
    }
    
    .btn {
      border: 1px solid var(--panel-border);
      background: rgba(255, 255, 255, 0.06);
      color: var(--cream);
      padding: 12px 24px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform .15s ease, background .2s ease, box-shadow .2s ease;
      font-family: 'Inter';
      width: 100%;
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.12);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--maroon-light), var(--maroon));
      border-color: transparent;
      box-shadow: 0 8px 24px rgba(139, 47, 58, 0.45);
    }
    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #c45264, #9a3541);
      box-shadow: 0 10px 30px rgba(139, 47, 58, 0.6);
    }

    /* DASHBOARD VIEW */
    #dashboard-view {
      display: none;
      padding: 40px;
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .header h2 {
      font-weight: 800;
      font-size: 28px;
      letter-spacing: -0.5px;
      color: var(--cream);
      margin: 0;
    }
    .filters {
      display: flex;
      gap: 16px;
      margin-bottom: 0px;
      background: rgba(0,0,0,0.2);
      padding: 24px 30px;
      border-radius: 0;
      border-bottom: 1px solid var(--panel-border);
      backdrop-filter: blur(12px);
      flex-wrap: wrap;
    }
    
    .panel {
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
      border-radius: 16px;
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    .analytics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      padding: 30px;
      border-bottom: 1px solid var(--panel-border);
    }
    .chart-card {
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 20px;
      position: relative;
    }
    .chart-card h3 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 15px;
      color: var(--cream);
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .filters select {
      background: rgba(0,0,0,0.3) url('data:image/svg+xml;utf8,<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(253, 243, 238, 0.5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>') no-repeat right 12px center;
      color: var(--text);
      border: 1px solid var(--panel-border);
      padding: 10px 36px 10px 14px;
      border-radius: 8px;
      font-family: 'Inter';
      font-size: 13px;
      appearance: none;
      cursor: pointer;
    }
    .filters select:focus {
      outline: none;
      border-color: var(--accent);
    }
    
    .table-container {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 22px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 14px;
      vertical-align: middle;
    }
    th { 
      color: var(--text-muted); 
      font-size: 11px; 
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: rgba(0,0,0,0.3);
      border-bottom: 1px solid var(--panel-border);
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    
    .status-text {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
    }
    .status-text::before {
      content: '';
      display: block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .status-step1::before { background: #FFB37A; box-shadow: 0 0 8px rgba(255, 179, 122, 0.5); }
    .status-step1 { color: rgba(255, 255, 255, 0.8); }
    
    .status-completed::before { background: #6EE7C5; box-shadow: 0 0 8px rgba(110, 231, 197, 0.5); }
    .status-completed { color: rgba(255, 255, 255, 0.8); }
    
    .btn-export { width: auto; font-size: 13px; padding: 10px 18px; margin-left: auto; }
    .btn-logout { width: auto; padding: 8px 16px; font-size: 13px; }
    
    .track-cell {
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    /* MODAL STYLES */
    #essayModal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: linear-gradient(180deg, #161218, #0a060c);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      width: 100%;
      max-width: 600px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 30px 60px rgba(0,0,0,0.6);
    }
    .modal-header {
      padding: 24px 30px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 {
      margin: 0;
      color: var(--cream);
      font-size: 18px;
    }
    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 24px;
      line-height: 1;
      padding: 0;
      transition: color 0.2s;
    }
    .modal-close:hover { color: #fff; }
    .modal-body {
      padding: 30px;
      overflow-y: auto;
      font-size: 15px;
      line-height: 1.6;
      color: rgba(255,255,255,0.85);
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <!-- Login Section -->
  <div id="login-view">
    <div class="login-box">
      <h2>LMS Login</h2>
      <input type="email" id="emailInput" class="input-field" placeholder="Admin Email" />
      <input type="password" id="passwordInput" class="input-field" placeholder="Password" />
      <button class="btn" id="loginBtn">Sign In</button>
      <p id="loginError" style="color: #ff6b6b; font-size: 13px; display: none; margin-top: 10px;"></p>
    </div>
  </div>

  <!-- Dashboard Section -->
  <div id="dashboard-view">
    <div class="header">
      <div class="header-content" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
        <h2>Lead Management</h2>
        <button class="btn btn-logout" id="logoutBtn">Logout</button>
      </div>
    </div>
    
    <div class="panel">
      <!-- Analytics Grid -->
      <div class="analytics-grid">
        <div class="chart-card">
          <h3>Leads Over Time</h3>
          <div style="position: relative; height: 260px; width: 100%;">
            <canvas id="leadsLineChart"></canvas>
          </div>
        </div>
        <div class="chart-card">
          <h3>Track Popularity</h3>
          <div style="position: relative; height: 260px; width: 100%; display: flex; justify-content: center;">
            <canvas id="trackPieChart"></canvas>
          </div>
        </div>
        <div class="chart-card">
          <h3>Submission Patterns</h3>
          <div style="position: relative; height: 260px; width: 100%; display: flex; justify-content: center;">
            <canvas id="patternsRadarChart"></canvas>
          </div>
        </div>
      </div>

      <div class="filters">
      <select id="dateFilter">
        <option value="all">All Time</option>
        <option value="today">Today</option>
        <option value="yesterday">Yesterday</option>
        <option value="7days">Last 7 Days</option>
        <option value="30days">Last 30 Days</option>
      </select>
      <select id="statusFilter">
        <option value="">All Statuses</option>
        <option value="Step 1 Complete">Step 1 Complete</option>
        <option value="Idea Submitted">Idea Submitted</option>
      </select>
      <select id="trackFilter">
        <option value="">All Tracks</option>
        <option value="Space Exploration">Space Exploration</option>
        <option value="Earth / Climate">Earth / Climate</option>
        <option value="Creative Businesses">Creative Businesses</option>
      </select>
      <div style="display: flex; gap: 8px; margin-left: auto;">
        <button class="btn btn-export" id="exportZohoBtn" style="background: linear-gradient(135deg, var(--maroon-light), var(--maroon)); color: var(--cream); border: none;">Export for Zoho CRM</button>
      </div>
    </div>

    <div class="table-container">
      <table id="leadsTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Name</th>
            <th>Email</th>
            <th>University</th>
            <th>Track</th>
            <th>Status</th>
            <th>Essay</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="leadsTableBody">
          <!-- Rows populated by JS -->
        </tbody>
      </table>
    </div>
  </div>
  </div>

  <!-- Firebase Integration Script -->
  <!-- Note: We will add Firebase SDK and config here once provided by the user -->
  <!-- Essay Modal -->
  <div id="essayModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Submission Essay</h3>
        <button class="modal-close" onclick="document.getElementById('essayModal').style.display='none'">&times;</button>
      </div>
      <div class="modal-body" id="essayContent"></div>
    </div>
  </div>

  <script type="module" src="./lms.js"></script>
</body>
</html>
